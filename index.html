function savePermissao(){
  var novo=(document.querySelector('[data-f="permissaoNomeNovo"]').value||'').trim();
  if(!novo){toast('Informe o nome da permissão.');return;}
  var antigo=(document.querySelector('[data-f="permissaoNome"]').value||'');
  var mods=[];document.querySelectorAll('[data-mod]:checked').forEach(function(c){mods.push(c.dataset.mod);});
  if(mods.length===PERM_MODULES.length)mods=['*'];
  ensurePermissoes();
  if(antigo&&antigo!==novo){delete DB.permissoes[antigo];DB.usuarios.forEach(function(u){if(u.permissao===antigo)u.permissao=novo;});}
  DB.permissoes[novo]=mods;
  save();closeModal();toast('Permissão salva.',true);rerender();
}
function excluirPermissao(nome){
  var u=currentUser();if(u&&u.permissao===nome){toast('Não é possível excluir a permissão que você está usando.');return;}
  confirmDialog('Excluir a permissão "'+nome+'"? Os usuários com ela passarão a ter somente leitura.',function(){
    delete DB.permissoes[nome];
    DB.usuarios.forEach(function(us){if(us.permissao===nome)us.permissao='Visualização';});
    save();closeModal();toast('Permissão excluída.');rerender();
  });
}

function almoxRows(f,q){
  var sm=almoxStockMap();var rows=[];
  almoxMats().forEach(function(m){
    if(f.categoria&&m.categoriaId!==f.categoria)return;
    if(f.subcategoria&&m.subcategoria!==f.subcategoria)return;
    if(f.material&&m.nome.toLowerCase().indexOf(f.material.toLowerCase())<0)return;
    if(f.fornecedor&&(m.fornecedor||'').toLowerCase().indexOf(f.fornecedor.toLowerCase())<0)return;
    if(f.lote&&(m.lote||'').toLowerCase().indexOf(f.lote.toLowerCase())<0)return;
    if(f.localizacao&&(m.localizacao||'').toLowerCase().indexOf(f.localizacao.toLowerCase())<0)return;
    var g=sm[(m.nome.toLowerCase()+'|'+(m.lote||'').toLowerCase())];
    var saldo=g?g.saldo:0;
    if(f.status&&almoxStatusMat(m,saldo)!==f.status)return;
    if(q&&(m.nome+' '+(m.codigo||'')+' '+(m.lote||'')+' '+(m.fornecedor||'')+' '+(m.localizacao||'')+' '+almoxCatNome(m.categoriaId)+' '+(m.subcategoria||'')).toLowerCase().indexOf(q)<0)return;
    rows.push({m:m,catNome:almoxCatNome(m.categoriaId),sub:m.subcategoria||'',saldo:saldo,entradas:g?g.entradas:0,saidas:g?g.saidas:0});
  });
  Object.keys(sm).forEach(function(k){
    var g=sm[k];
    if(almoxMatByNome(g.material))return;
    if(f.categoria&&g.categoriaId!==f.categoria&&g.categoria!==f.categoria)return;
    if(f.lote&&g.lote!==f.lote)return;
    if(q&&(g.material+' '+(g.categoria||'')+' '+(g.lote||'')+' '+(g.localizacao||'')).toLowerCase().indexOf(q)<0)return;
    rows.push({m:null,catNome:g.categoria||'—',sub:'',saldo:g.saldo,entradas:g.entradas,saidas:g.saidas});
  });
  return rows;
}

function almoxDragStart(ev,el){window.__dragCatId=el.getAttribute('data-catid');ev.dataTransfer.effectAllowed='move';}
function almoxDragOver(ev){ev.preventDefault();ev.dataTransfer.dropEffect='move';}
function almoxDrop(ev,el){ev.preventDefault();var from=window.__dragCatId;var to=el.getAttribute('data-catid');if(!from||!to||from===to)return;var arr=DB.almoxCategorias;var fi=-1,ti=-1;for(var k=0;k<arr.length;k++){if(arr[k].id===from)fi=k;if(arr[k].id===to)ti=k;}if(fi<0||ti<0)return;var it=arr.splice(fi,1)[0];arr.splice(ti,0,it);save();renderAlmoxarifado();}
function almoxDragEnd(){window.__dragCatId=null;}
function almoxCatMove(id,dir){var arr=DB.almoxCategorias;var i=-1;for(var k=0;k<arr.length;k++)if(arr[k].id===id){i=k;break;}if(i<0)return;var j=i+dir;if(j<0||j>=arr.length)return;var t=arr[i];arr[i]=arr[j];arr[j]=t;save();renderAlmoxarifado();}

function saveAlmoxCat(){
  var d=readForm();
  if(!d.nome){toast('Informe o nome da categoria.');return;}
  if(d.catId){var c=almoxCat(d.catId);if(c){c.nome=d.nome;c.descricao=d.descricao||'';c.icone=d.icone||'box';}}
  else{
    var nova={id:uid(),nome:d.nome,descricao:d.descricao||'',icone:d.icone||'box',subcategorias:[]};
    if(d.subsIniciais){d.subsIniciais.split('\n').forEach(function(s){s=s.trim();if(s)nova.subcategorias.push({id:uid(),nome:s});});}
    DB.almoxCategorias.push(nova);

}

function readImage(file,cb){var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){var max=900;var w=img.width,h=img.height;var sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);cb(c.toDataURL('image/jpeg',0.72));};img.src=r.result;};r.readAsDataURL(file);}

function ensureCeramica(){
  DB.ceramicaAndares=(DB.ceramicaAndares&&DB.ceramicaAndares.length)?DB.ceramicaAndares:CER_ANDARES.slice();

    l.ambientes=l.ambientes||[];l.reservas=l.reservas||[];l.historico=l.historico||[];l.anexos=l.anexos||[];
    (l.apartamentos||[]).forEach(function(a){l.ambientes.push({id:a.id||uid(),andar:a.pavimento||a.andar||'',ambiente:a.ambiente||'',apartamento:a.apartamento||'',quantidade:num(a.quantidade),dataLiberacao:a.data||'',horaLiberacao:'',retiradoPor:a.responsavel||'',observacao:''});});

    if(l.codigo===undefined)l.codigo='';
    if(l.dimensao===undefined)l.dimensao='';

function cerLotes(){return DB.ceramicaLotes||[];}
function cerLote(id){var i;for(i=0;i<cerLotes().length;i++)if(cerLotes()[i].id===id)return cerLotes()[i];return null;}
function cerLiberada(l){return (l.ambientes||[]).reduce(function(a,x){return a+num(x.quantidade);},0);}
function cerAplicada(l){return cerLiberada(l);}
function cerReservaQtd(l){return (l.reservas||[]).reduce(function(a,r){return a+num(r.qtd);},0);}
function cerSaldo(l){return num(l.qtdRecebida)-cerLiberada(l)-cerReservaQtd(l);}
function cerStatus(l){var s=cerSaldo(l);if(s<=0)return 'CONCLUÍDO';if(cerLiberada(l)>0)return 'EM USO';return 'EM ESTOQUE';}
function cerStatusBadge(st){var map={'EM ESTOQUE':'bve','EM USO':'bam','CONCLUÍDO':'bci','RESERVADO':'baz'};return '<span class="badge '+(map[st]||'bci')+'"><span class="bd"></span>'+esc(st)+'</span>';}
function cerUsers(){return DB.usuarios.map(function(u){return u.nome;});}
function cerUniq(arr){var out=[],i;for(i=0;i<arr.length;i++)if(arr[i]&&out.indexOf(arr[i])<0)out.push(arr[i]);return out;}
function cerFiltros(){return window.__cerFiltros||{};}

function openProtModal(r,statusPre){
  var notasOpts='<option value="">— Selecione uma nota —</option>'+DB.notas.map(function(n){return '<option value="'+n.id+'"'+(r&&r.notaFiscal===n.numero?' selected':'')+'>'+esc(n.numero)+' — '+esc(n.fornecedor||'')+'</option>';}).join('');
  openModal('<div class="mh"><h3>'+(r?'EDITAR REGISTRO':'NOVO MATERIAL')+'</h3><button class="mx" data-action="close-modal"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div><div class="fg">'+fldHtml('codigo','ID do Produto','text',r?r.codigo:'')+fldHtml('notaFiscal','Nota Fiscal','text',r?r.notaFiscal:'')+'<div class="fld"><label>Tipo de Proteção</label><select data-f="tipo">'+protTipos().map(function(t){return '<option'+(r&&r.tipo===t?' selected':'')+'>'+esc(t)+'</option>';}).join('')+'</select></div>'+fldHtml('material','Material','text',r?r.material:'')+fldHtml('quantidade','Quantidade','number',r?r.quantidade:'')+'<div class="fld"><label>Unidade</label><select data-f="unidade">'+protUnidades().map(function(u){return '<option'+(r&&r.unidade===u?' selected':'')+'>'+u+'</option>';}).join('')+'</select></div>'+fldHtml('utilizado','Utilizado','number',r?r.utilizado:'')+fldHtml('devolvido','Devolvido','number',r?r.devolvido:'')+'<div class="fld"><label>Status</label><select data-f="status"><option'+(statusPre==='Retirado'||(r&&r.status==='Retirado')?' selected':'')+'>Instalado</option><option'+(statusPre==='Retirado'||(r&&r.status==='Retirado')?' selected':'')+'>Retirado</option></select></div>'+fldHtml('responsavel','Responsável','text',r?r.responsavel:'')+'<div class="fld"><label>Data</label><div style="display:flex;gap:6px"><input type="date" data-f="data" value="'+esc(r?r.data:'')+'" style="flex:1;border:1px solid var(--cl);border-radius:9px;padding:9px 12px"><button class="btn bo bs" data-action="prot-cal" data-target="data" title="Calendário">'+CAL_ICON+'</button></div></div></div><div style="margin-top:10px"><span style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--me)">Integração com Controle de Notas</span><select data-action="prot-nota-select" style="width:100%;margin-top:6px;border:1px solid var(--cl);border-radius:9px;padding:9px 12px">'+notasOpts+'</select></div><div class="mf"><button class="btn bo" data-action="close-modal">CANCELAR</button>'+(canEditModulo('protecaometalica')?'<button class="btn bp" data-action="prot-salvar" data-id="'+(r?r.id:'')+'">SALVAR</button>':'')+'</div>');
}
function saveProtReg(id){
  var d=readForm();
  if(!d.codigo){toast('Informe o ID do produto.');return;}
  if(id){var r=protReg(id);if(r)Object.assign(r,d);}
  else{d.id=uid();d.medidas={altura:'',comprimento:'',largura:'',outras:''};d.ocorrencias=[];DB.protecaoMetalica.push(d);addLog('Proteção Metálica','Cadastro','Cadastrou a peça '+d.codigo+'.');}
  save();closeModal();toast('Alterações salvas com sucesso.',true);rerender();
}
function excluirProtReg(id){var r=protReg(id);if(!r)return;confirmDialog('Excluir o registro "'+r.codigo+'"?',function(){DB.protecaoMetalica=DB.protecaoMetalica.filter(function(x){return x.id!==id;});save();closeModal();toast('Registro excluído.',true);rerender();});}
function duplicarProtReg(id){var r=protReg(id);if(!r)return;var n=JSON.parse(JSON.stringify(r));n.id=uid();n.codigo=(n.codigo||'')+'-C';n.ocorrencias=(n.ocorrencias||[]).map(function(o){o.id=uid();return o;});DB.protecaoMetalica.push(n);save();toast('Registro duplicado.',true);rerender();}
function openProtInfo(r){
  var med=r.medidas||{};
  var occ=(r.ocorrencias||[]).map(function(o){
    return '<div style="border:1px solid var(--cl);border-radius:10px;padding:10px;margin-bottom:8px"><div style="display:flex;gap:6px;align-items:center;margin-bottom:6px"><input type="date" data-occ="'+o.id+'" data-f="data" value="'+esc(o.data||'')+'" style="flex:1;border:1px solid var(--cl);border-radius:8px;padding:7px 10px"><button class="btn bo bs" data-action="prot-cal" data-target="occ:'+o.id+':data" title="Calendário">'+CAL_ICON+'</button></div><textarea data-occ="'+o.id+'" data-f="descricao" placeholder="Descrição da ocorrência" style="width:100%;border:1px solid var(--cl);border-radius:8px;padding:7px 10px;min-height:60px">'+esc(o.descricao||'')+'</textarea><div style="display:flex;justify-content:flex-end;margin-top:6px"><button class="ib danger" data-action="prot-occ-remover" data-id="'+r.id+'" data-occ="'+o.id+'">'+ic('trash')+'</button></div></div>';
  }).join('');
  openModal('<div class="mh"><h3>INFORMAÇÕES DA PEÇA — '+esc(r.codigo)+'</h3><button class="mx" data-action="close-modal"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div><div class="st" style="margin-top:0">Medidas da peça</div><div class="fg">'+fldHtml('altura','Altura','text',med.altura||'')+fldHtml('comprimento','Comprimento','text',med.comprimento||'')+fldHtml('largura','Largura','text',med.largura||'')+fldHtml('outras','Outras medidas','text',med.outras||'')+'</div><div class="st">Ocorrências</div><div id="prot-occ-list">'+(occ||'<div class="empty">Nenhuma ocorrência.</div>')+'</div><div style="margin-top:8px"><button class="btn bo" data-action="prot-occ-add" data-id="'+r.id+'">'+ic('plus')+' ADICIONAR OCORRÊNCIA</button></div><div class="mf"><button class="btn bo" data-action="close-modal">CANCELAR</button>'+(canEditModulo('protecaometalica')?'<button class="btn bp" data-action="prot-info-salvar" data-id="'+r.id+'">SALVAR INFORMAÇÕES</button>':'')+'</div>','wide');
}
function saveProtInfo(id){
  var r=protReg(id);if(!r)return;
  r.medidas={altura:document.querySelector('[data-f="altura"]').value,comprimento:document.querySelector('[data-f="comprimento"]').value,largura:document.querySelector('[data-f="largura"]').value,outras:document.querySelector('[data-f="outras"]').value};
  document.querySelectorAll('[data-occ]').forEach(function(el){
    var oid=el.dataset.occ;var o=r.ocorrencias.filter(function(x){return x.id===oid;})[0];if(!o)return;
    if(el.dataset.f==='data')o.data=el.value;else o.descricao=el.value;
  });
  save();closeModal();toast('Informações salvas.',true);rerender();
}
function protAddOcc(id){var r=protReg(id);if(!r)return;r.ocorrencias=r.ocorrencias||[];r.ocorrencias.push({id:uid(),data:'',descricao:''});openProtInfo(r);}
function protRemOcc(id,oid){var r=protReg(id);if(!r)return;r.ocorrencias=r.ocorrencias.filter(function(x){return x.id!==oid;});openProtInfo(r);}
function openProtCatModal(){openModal('<div class="mh"><h3>ADICIONAR CATEGORIA</h3><button class="mx" data-action="close-modal"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div><div class="fg"><div class="fld full"><label>Nome do tipo de proteção</label><input data-f="novoTipo" placeholder="Ex.: Mureta metálica"></div></div><div class="mf"><button class="btn bo" data-action="close-modal">CANCELAR</button><button class="btn bp" data-action="prot-cat-salvar">ADICIONAR</button></div>');}
function saveProtCat(){var v=(document.querySelector('[data-f="novoTipo"]').value||'').trim();if(!v){toast('Informe o nome.');return;}DB.protTipos=protTipos();if(DB.protTipos.indexOf(v)<0)DB.protTipos.push(v);save();closeModal();toast('Categoria adicionada.',true);rerender();}
function openProtGerCat(){openModal('<div class="mh"><h3>GERENCIAR CATEGORIAS</h3><button class="mx" data-action="close-modal"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div><div class="fld full"><label>Tipos de proteção (um por linha)</label><textarea data-f="tiposList" style="min-height:120px">'+protTipos().join('\n')+'</textarea></div><div class="mf"><button class="btn bo" data-action="close-modal">CANCELAR</button><button class="btn bp" data-action="prot-ger-salvar">SALVAR</button></div>');}
function saveProtGer(){var v=document.querySelector('[data-f="tiposList"]').value.split('\n').map(function(x){return x.trim();}).filter(Boolean);DB.protTipos=v.length?v:['Guarda-corpo metálico','Tela metálica','Gradil metálico','Outros'];save();closeModal();toast('Categorias salvas.',true);rerender();}
function protCal(target){var i=document.querySelector('[data-f="'+target+'"]');if(i&&i.type==='date'){try{i.showPicker&&i.showPicker();}catch(e){i.focus();}}}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-action]');if(!el)return;var a=el.dataset.action;
  switch(a){
    case 'prot-novo':openProtModal(null,'Instalado');break;
    case 'prot-entrada':openProtModal(null,'Instalado');break;
    case 'prot-saida':openProtModal(null,'Retirado');break;
    case 'prot-editar':{var pr=protReg(el.dataset.id);if(pr)openProtModal(pr);break;}
    case 'prot-salvar':saveProtReg(el.dataset.id);break;
    case 'prot-excluir':excluirProtReg(el.dataset.id);break;
    case 'prot-duplicar':duplicarProtReg(el.dataset.id);break;
    case 'prot-info':{var pi=protReg(el.dataset.id);if(pi)openProtInfo(pi);break;}
    case 'prot-info-salvar':saveProtInfo(el.dataset.id);break;
    case 'prot-occ-add':protAddOcc(el.dataset.id);break;
    case 'prot-occ-remover':protRemOcc(el.dataset.id,el.dataset.occ);break;
    case 'prot-add-cat':openProtCatModal();break;
    case 'prot-cat-salvar':saveProtCat();break;
    case 'prot-ger-cat':openProtGerCat();break;
    case 'prot-ger-salvar':saveProtGer();break;
    case 'prot-cal':protCal(el.dataset.target);break;
    case 'toggle-prot-filtros':{var pf=document.getElementById('prot-fbar');if(pf)pf.classList.toggle('open');window.__protFiltrosOpen=pf?pf.classList.contains('open'):false;break;}
  }
});
document.addEventListener('change',function(e){
  var el=e.target;if(!el||!el.dataset)return;
  if(el.dataset.action==='prot-search'){window.__protFiltros=window.__protFiltros||{};window.__protFiltros.q=el.value;renderProtecaoMetalica();}
  if(el.dataset.action==='prot-filtro'){window.__protFiltros=window.__protFiltros||{};window.__protFiltros[el.dataset.f]=el.value;renderProtecaoMetalica();}
  if(el.dataset.action==='prot-nota-select'){var nt=DB.notas.find(function(x){return x.id===el.value;});if(nt){var sf=function(k,v){var i=document.querySelector('[data-f="'+k+'"]');if(i)i.value=v==null?'':v;};sf('notaFiscal',nt.numero);sf('material',nt.material||'');sf('responsavel',nt.fornecedor||'');sf('unidade',nt.unidade||'');sf('quantidade',nt.movs&&nt.movs.length?nt.movs[0].quantidade:'');toast('Nota vinculada. Campos preenchidos.',true);}}
});
ensureProtecao();
function init(){ensurePermissoes();ensureCeramica();renderSidebar();if(DB.session){hideLogin();}else{showLogin();}render();}
init();
</script>
</body>
</html>
